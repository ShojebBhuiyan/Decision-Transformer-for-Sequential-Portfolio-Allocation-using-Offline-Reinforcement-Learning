# Decision Transformer Portfolio Allocation — default config

project:
  name: portfolio_dt
  seed: 42
  device: cuda  # fallback to cpu if unavailable

data:
  dataset_dir: dataset
  universe: A  # A or B
  start_date: "2000-09-01"
  end_date: "2025-12-30"
  lookback: 10
  max_forward_fill: 5
  feature_set: minimal  # minimal | full

splits:
  train_start: "2000-09-01"
  train_end: "2016-12-31"
  val_start: "2017-01-01"
  val_end: "2019-12-31"
  test_start: "2020-01-01"
  test_end: "2025-12-30"

env:
  transaction_cost: 0.001
  reward_epsilon: 1.0e-8
  episode_length: 252
  episode_stride: 21

trajectories:
  output_dir: data/trajectories
  n_windows_per_policy: 30

model:
  context_length: 30
  d_model: 128
  n_layers: 3
  n_heads: 4
  dropout: 0.1
  learning_rate: 0.0001
  batch_size: 32
  max_epochs: 3
  max_train_samples: 8000
  weight_decay: 0.0001

training:
  seeds: [42]
  checkpoint_dir: results/checkpoints
  log_dir: results/runs

evaluation:
  risk_free_rate: 0.02
  benchmark: "S&P 500 ETF"
  rtg_quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]

ablations:
  context_lengths: [10, 20, 30, 50]
  transaction_costs: [0.0, 0.0005, 0.001, 0.0025]
