# Decision Transformer Portfolio Allocation — default config

project:
  name: portfolio_dt
  seed: 42
  device: cuda  # fallback to cpu if unavailable

data:
  dataset_dir: dataset
  universe: A  # A or B
  start_date: "2000-09-01"
  end_date: "2025-12-30"
  lookback: 20
  max_forward_fill: 5
  feature_set: full  # minimal | full

splits:
  train_start: "2000-09-01"
  train_end: "2016-12-31"
  val_start: "2017-01-01"
  val_end: "2019-12-31"
  test_start: "2020-01-01"
  test_end: "2025-12-30"

env:
  transaction_cost: 0.001
  reward_epsilon: 1.0e-8
  episode_length: 252
  episode_stride: 21

trajectories:
  output_dir: data/trajectories
  n_windows_per_policy: 200

model:
  context_length: 30
  d_model: 192
  n_layers: 4
  n_heads: 6
  dropout: 0.1
  learning_rate: 0.0001
  batch_size: 256  # ~1.6 GB peak on GTX 1070; throughput plateaus at ~1300 samples/s
  max_epochs: 50
  weight_decay: 0.0001

training:
  seeds: [42, 123, 456, 789, 1011]
  checkpoint_dir: results/checkpoints
  log_dir: results/runs
  gpu_resident_buffer: true   # trajectories live on GPU (~140 MB); false = CPU + per-batch copy
  # A full pass is 3189 steps @ batch 256 (~10.4 min/epoch), which makes the
  # 5-seed sweep ~150 h on a GTX 1070. 200 steps/epoch x 50 epochs still covers
  # ~3 full passes of the 816k training samples and fits the sweep overnight.
  steps_per_epoch: 200        # null = full pass
  max_val_batches: 40         # null = all 354 val batches every epoch

evaluation:
  risk_free_rate: 0.02
  benchmark: "S&P 500 ETF"
  rtg_quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]

ablations:
  context_lengths: [10, 20, 30, 50]
  transaction_costs: [0.0, 0.0005, 0.001, 0.0025]
